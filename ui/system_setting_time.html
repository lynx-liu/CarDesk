<!DOCTYPE html>
<html>
<head>
<meta  charset="utf-8"  />
<link type="text/css" rel="stylesheet" href="css/style.css"/>
<title>系统设置</title>
</head>

<body>
<div id="box"  class="boxin">
	<div class="top">
		<div class="top_icon_home top_icon"><a  href="index.html"></a></div>
		<h1>系统设置</h1>
		<div class="top_icon">
			<ul>
				<li></li>
				<li></li>
				<li><span>10</span></li>				
				<li>10:20</li>
			</ul>
		</div>
	</div>
	<div class="back"  onclick="window.location.href='system_setting_display_mode.html'"></div>		
	
	<div class="setting_time_con">
		<div class="setting_time_data">
			<div>
				<span>小时</span>
				<ul>
					<li class="on">1</li>
					<li>0</li>
				</ul>
			</div>
			<div class="separator ">:</div>
			<div>
				<span>分钟</span>
				<ul>
					<li>2</li>
					<li>0</li>
				</ul>
			</div>
		</div>
		<div class="setting_time_btn_box">
			<ul>
				<li></li>
				<li></li>
			</ul>
		</div>
	</div>
	<div class="page_btn time_btn">
		<button class="format_btn">确认</button>
		<button class="format_btn reset_btn"onclick="window.location.href='system_setting_display_mode.html'">取消</button>
	</div>
</div>
</body>
</html>
